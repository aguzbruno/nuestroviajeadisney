<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Disney NYC Trip">
  <defs>
    <linearGradient id="disneySky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="55%" stop-color="#1a5fb4"/>
      <stop offset="100%" stop-color="#0d3a7a"/>
    </linearGradient>
    <linearGradient id="nycNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="45%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#f0c14b"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Left: Disney -->
    <rect width="256" height="512" fill="url(#disneySky)"/>
    <!-- Right: NYC -->
    <rect x="256" width="256" height="512" fill="url(#nycNight)"/>

    <!-- Soft stars Disney -->
    <g fill="#fff8e7" opacity="0.9">
      <circle cx="48" cy="72" r="3"/>
      <circle cx="110" cy="48" r="2"/>
      <circle cx="180" cy="88" r="2.5"/>
      <circle cx="70" cy="140" r="2"/>
      <path d="M210 56l3.2 9.8h10.3l-8.3 6 3.2 9.8-8.4-6.1-8.4 6.1 3.2-9.8-8.3-6h10.3z" fill="#ffe08a"/>
    </g>

    <!-- Stars NYC -->
    <g fill="#f0c14b" opacity="0.85">
      <circle cx="300" cy="60" r="2"/>
      <circle cx="360" cy="40" r="1.5"/>
      <circle cx="420" cy="70" r="2.5"/>
      <circle cx="470" cy="50" r="1.5"/>
      <circle cx="330" cy="110" r="1.5"/>
    </g>

    <!-- Castle (Disney half) -->
    <g fill="url(#gold)" transform="translate(18, 150)">
      <!-- Base -->
      <rect x="40" y="220" width="160" height="40" rx="4"/>
      <!-- Left tower -->
      <rect x="48" y="140" width="36" height="120"/>
      <polygon points="48,140 66,95 84,140"/>
      <rect x="60" y="108" width="12" height="22"/>
      <circle cx="66" cy="100" r="5"/>
      <!-- Right tower -->
      <rect x="156" y="150" width="36" height="110"/>
      <polygon points="156,150 174,110 192,150"/>
      <rect x="168" y="122" width="12" height="20"/>
      <circle cx="174" cy="115" r="5"/>
      <!-- Center keep -->
      <rect x="90" y="120" width="60" height="140"/>
      <polygon points="90,120 120,70 150,120"/>
      <!-- Tall spire -->
      <rect x="112" y="40" width="16" height="80"/>
      <polygon points="112,40 120,8 128,40"/>
      <circle cx="120" cy="6" r="4" fill="#ffe08a"/>
      <!-- Gate -->
      <path d="M108 260 v-36 a12 12 0 0 1 24 0 v36z" fill="#0d3a7a"/>
      <!-- Windows -->
      <rect x="56" y="170" width="10" height="14" rx="2" fill="#0d3a7a"/>
      <rect x="168" y="180" width="10" height="14" rx="2" fill="#0d3a7a"/>
      <rect x="104" y="150" width="10" height="14" rx="2" fill="#0d3a7a"/>
      <rect x="126" y="150" width="10" height="14" rx="2" fill="#0d3a7a"/>
    </g>

    <!-- NYC skyline -->
    <g transform="translate(256, 150)">
      <!-- Background buildings -->
      <rect x="12" y="170" width="40" height="130" fill="#3a4a6b"/>
      <rect x="58" y="140" width="36" height="160" fill="#2a3a55"/>
      <rect x="200" y="160" width="44" height="140" fill="#3a4a6b"/>

      <!-- Empire State-ish -->
      <rect x="100" y="70" width="52" height="230" fill="#c5cdd8"/>
      <rect x="112" y="30" width="28" height="40" fill="#d8dee8"/>
      <rect x="122" y="8" width="8" height="22" fill="#f0c14b"/>
      <circle cx="126" cy="6" r="3" fill="#ffe08a"/>

      <!-- Chrysler-ish -->
      <rect x="162" y="110" width="36" height="190" fill="#a8b4c4"/>
      <polygon points="162,110 180,75 198,110" fill="#c5cdd8"/>

      <!-- Left mid building -->
      <rect x="28" y="200" width="48" height="100" fill="#8a96a8"/>

      <!-- Windows glow -->
      <g fill="#f0c14b">
        <rect x="20" y="185" width="6" height="8" rx="1" opacity="0.9"/>
        <rect x="32" y="185" width="6" height="8" rx="1" opacity="0.55"/>
        <rect x="20" y="205" width="6" height="8" rx="1" opacity="0.7"/>
        <rect x="32" y="220" width="6" height="8" rx="1" opacity="0.9"/>
        <rect x="68" y="160" width="6" height="8" rx="1" opacity="0.8"/>
        <rect x="80" y="175" width="6" height="8" rx="1" opacity="0.5"/>
        <rect x="68" y="195" width="6" height="8" rx="1" opacity="0.9"/>
        <rect x="110" y="100" width="7" height="9" rx="1"/>
        <rect x="124" y="100" width="7" height="9" rx="1" opacity="0.6"/>
        <rect x="138" y="100" width="7" height="9" rx="1"/>
        <rect x="110" y="125" width="7" height="9" rx="1" opacity="0.55"/>
        <rect x="124" y="125" width="7" height="9" rx="1"/>
        <rect x="138" y="150" width="7" height="9" rx="1"/>
        <rect x="110" y="175" width="7" height="9" rx="1"/>
        <rect x="124" y="200" width="7" height="9" rx="1" opacity="0.7"/>
        <rect x="170" y="140" width="6" height="8" rx="1"/>
        <rect x="182" y="155" width="6" height="8" rx="1" opacity="0.6"/>
        <rect x="170" y="175" width="6" height="8" rx="1"/>
        <rect x="210" y="180" width="6" height="8" rx="1" opacity="0.85"/>
        <rect x="222" y="200" width="6" height="8" rx="1"/>
        <rect x="210" y="220" width="6" height="8" rx="1" opacity="0.55"/>
      </g>
    </g>

    <!-- Ground / water strip -->
    <rect y="448" width="256" height="64" fill="#0d3a7a" opacity="0.45"/>
    <rect x="256" y="448" width="256" height="64" fill="#0a1628" opacity="0.7"/>

    <!-- Center divider glow -->
    <rect x="252" width="8" height="512" fill="#fff8e7" opacity="0.35"/>

    <!-- Travel suitcase badge (center) -->
    <g transform="translate(256, 400)">
      <ellipse cx="0" cy="28" rx="52" ry="14" fill="#000" opacity="0.2"/>
      <rect x="-40" y="-18" width="80" height="52" rx="10" fill="#e31c23"/>
      <rect x="-40" y="-18" width="80" height="14" rx="6" fill="#b8141a"/>
      <rect x="-12" y="-30" width="24" height="16" rx="4" fill="none" stroke="#f0c14b" stroke-width="5"/>
      <circle cx="-22" cy="12" r="5" fill="#f0c14b"/>
      <circle cx="22" cy="12" r="5" fill="#f0c14b"/>
      <rect x="-4" y="-6" width="8" height="22" rx="2" fill="#ffe08a"/>
      <!-- Tiny Mickey ears on suitcase -->
      <circle cx="-28" cy="-28" r="7" fill="#1a1a2e"/>
      <circle cx="-14" cy="-28" r="7" fill="#1a1a2e"/>
      <circle cx="-21" cy="-20" r="9" fill="#1a1a2e"/>
    </g>

    <!-- Small airplane arc suggesting travel -->
    <g fill="#fff8e7" opacity="0.95">
      <path d="M236 130 c40-45 80-45 120 0" fill="none" stroke="#fff8e7" stroke-width="3" stroke-dasharray="6 8" opacity="0.55"/>
      <path d="M348 128 l18-4 -4 10 10 2 -18 6 -2-8 -10 2z" fill="#e31c23"/>
    </g>
  </g>
</svg>
